; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitm-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    lvgl/lvgl@9.6.0
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@2.5.2
build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; LVGL chat layout can consume more stack when rendering a full AI answer.
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; TFT_eSPI setup for the bundled 2.8 inch ESP32-S3 ILI9341V display.
    ; USER_SETUP_LOADED prevents TFT_eSPI's generic User_Setup.h from overriding
    ; the board-specific definitions below.
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT
